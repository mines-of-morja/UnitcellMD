<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnitcellMD queue</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1c2430; --muted: #66707e; --line: #dfe3e8;
  --ok: #1b7f4b; --warn: #a15c00; --bad: #b3261e; --acc: #2457c5; --bar: #dfe6f5;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171c; --card: #1c2027; --fg: #e6e9ee; --muted: #9aa4b2; --line: #2d333d;
    --ok: #4cc38a; --warn: #e0a040; --bad: #f2877f; --acc: #7aa2f7; --bar: #2a3552; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin: 22px 0 8px; }
.sub { color: var(--muted); font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.grow { flex: 1 1 auto; min-width: 0; }
.tag { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 12px;
  border: 1px solid var(--line); color: var(--muted); }
.tag.busy, .tag.running, .tag.active, .tag.claimed, .tag.open { color: var(--acc); border-color: var(--acc); }
.tag.idle, .tag.done { color: var(--ok); border-color: var(--ok); }
.tag.freed, .tag.stopping, .tag.paused, .tag.waiting, .tag.stopped, .tag.pending, .tag.blocked { color: var(--warn); border-color: var(--warn); }
.tag.orphan, .tag.failed, .tag.unreachable, .tag.unscheduled { color: var(--bad); border-color: var(--bad); }
.bar { height: 8px; border-radius: 4px; background: var(--bar); overflow: hidden; margin: 6px 0 2px; }
.bar > i { display: block; height: 100%; background: var(--acc); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line);
  vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, monospace; font-size: 12px; }
.err { color: var(--bad); }
pre { margin: 0; white-space: pre-wrap; font-size: 12px; color: var(--muted); }
.node { border-top: 2px solid var(--line); margin-top: 28px; padding-top: 4px; }
.empty { color: var(--muted); }
nav { display: flex; gap: 4px; margin: 12px 0 4px; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
  font: inherit; padding: 6px 12px; cursor: pointer; }
nav button.on { color: var(--fg); border-bottom-color: var(--acc); }
button.act { font: inherit; font-size: 12px; padding: 2px 9px; margin: 2px 2px 0 0; cursor: pointer;
  border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
button.act:hover { border-color: var(--acc); }
button.act.on { background: var(--acc); border-color: var(--acc); color: var(--card); }
button.act.danger { color: var(--bad); }
.doc { max-width: 800px; }
.doc h1 { font-size: 18px; margin: 16px 0 8px; }
.doc h2 { margin-top: 20px; }
.doc p, .doc li { margin: 6px 0; }
.doc pre.code { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; color: var(--fg); overflow-x: auto; white-space: pre; margin: 8px 0; }
.doc code { font-family: ui-monospace, monospace; font-size: 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>UnitcellMD queue</h1>
  <div class="sub" id="stamp">loading …</div>
  <nav id="tabs"></nav>
  <div id="nodes"></div>
</main>
<script>
"use strict";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const tag = (cls, text) => `<span class="tag ${esc(cls)}">${esc(text ?? cls)}</span>`;

function dur(s) {
  if (s == null) return "…";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min`;
}

function resources(list) {
  return (list || []).map((r) => {
    const t = r.telemetry || {};
    let extra = "";
    if (r.kind === "gpu" && t.power_W != null) {
      const stale = t.age_s > 60 ? ` <span class="err">(telemetry ${dur(t.age_s)} old)</span>` : "";
      extra = `${t.busy_pct ?? "?"} % busy, ${t.power_W} W of ${t.cap_W ?? "?"} W, ` +
              `${t.edge_C ?? "?"}/${t.junction_C ?? "?"} °C${stale}`;
    } else if (r.kind === "cpu") {
      extra = `load ${t.load1?.toFixed(1)} / ${t.load5?.toFixed(1)} (1/5 min)`;
    }
    return `<div class="card"><div class="row"><b>${esc(r.name)}</b> ${tag(r.state)}
      <span class="grow">${esc(r.detail)}</span><span class="sub">${extra}</span></div></div>`;
  }).join("") || '<div class="empty">no resources</div>';
}

function running(list) {
  if (!list || !list.length) return '<div class="empty">nothing is running</div>';
  return list.map((r) => {
    const pct = r.fraction == null ? null : Math.round(r.fraction * 1000) / 10;
    const info = [];
    if (r.time_ps != null) info.push(`${r.time_ps.toFixed(0)} ps`);
    if (r.steps) info.push(`${(r.step / 1e6).toFixed(2)} of ${(r.steps / 1e6).toFixed(2)} M steps`);
    if (r.ns_per_day) info.push(`${r.ns_per_day.toFixed(0)} ns/day`);
    info.push(`ETA ${dur(r.eta_s)}`);
    return `<div class="card"><div class="row"><b>${esc(r.run)}</b>
      <span class="sub">${esc(r.study)}</span>
      ${r.orphan ? tag("orphan", "orphaned: its driver is gone") : tag("running")}
      <span class="grow"></span><span class="num">${pct == null ? "" : pct + " %"}</span></div>
      <div class="bar"><i style="width:${pct ?? 0}%"></i></div>
      <div class="sub">${esc(info.join(" · "))}</div></div>`;
  }).join("");
}

function next(list) {
  if (!list || !list.length) return '<div class="empty">nothing is queued</div>';
  return `<table><tr><th class="num">#</th><th>run</th><th>study</th><th>state</th><th>why</th></tr>` +
    list.map((n) => `<tr><td class="num">${n.rank}</td><td class="mono">${esc(n.run)}</td>
      <td class="sub">${esc(n.study)}</td><td>${tag(n.state)}</td><td>${esc(n.why)}</td></tr>`).join("") +
    "</table>";
}

function queues(list) {
  if (!list || !list.length) return '<div class="empty">no queue script is alive</div>';
  return list.map((q) => `<div class="card"><div class="row"><b>${esc(q.name)}</b> ${tag(q.state)}
    <span class="sub mono">pid ${q.pid}</span></div>
    <div class="sub">${esc(q.description)}</div>
    <div class="sub mono">${esc((q.studies || []).join(", "))}</div></div>`).join("");
}

function studies(list) {
  const order = ["done", "running", "stopped", "pending", "failed"];
  const open = (s) => ["pending", "stopped", "failed", "running"].reduce((n, k) => n + (s.counts[k] || 0), 0);
  const rank = (s) => s.driver_pid ? 0 : (s.scheduled_by || []).length ? 1 : open(s) ? 2 : 3;
  const rows = (list || []).filter((s) => s.total).sort((a, b) =>
    (rank(a) - rank(b)) || b.name.localeCompare(a.name));
  return `<table><tr><th>study</th><th>runs</th><th></th></tr>` + rows.map((s) => {
    const c = order.filter((k) => s.counts[k]).map((k) => `${s.counts[k]} ${k}`).join(", ");
    let who = "";
    if (s.driver_pid) who = tag("running", "driver running");
    else if ((s.scheduled_by || []).length) who = tag("waiting", "in " + s.scheduled_by.join(", "));
    else if (open(s)) who = tag("unscheduled", "not scheduled");
    return `<tr><td class="mono">${esc(s.name)}<div class="sub">${esc((s.question || "").slice(0, 130))}</div></td>
      <td>${esc(c)}</td><td>${who}</td></tr>`;
  }).join("") + "</table>";
}

function tasks(list) {
  if (!list || !list.length) return '<div class="empty">no tasks</div>';
  return `<table><tr><th>id</th><th>task</th><th>needs</th><th>state</th></tr>` + list.map((t) => {
    const wait = [...(t.after || []).map((a) => "after " + a), t.waits_for].filter(Boolean).join("; ");
    return `<tr><td class="mono">${esc(t.id)}</td><td><b>${esc(t.title)}</b>
      <div class="sub">${esc(t.goal)}</div>
      <div class="sub">Accept: ${esc(t.acceptance)}</div>
      ${wait ? `<div class="sub">Waits for: ${esc(wait)}</div>` : ""}</td>
      <td>${esc(t.needs)}${t.author ? " + author" : ""}</td>
      <td>${tag(t.state)}${t.claimed_by ? `<div class="sub">${esc(t.claimed_by)}</div>` : ""}</td></tr>`;
  }).join("") + "</table>";
}

const act = (label, attrs, cls) => `<button class="act ${cls || ""}" ${Object.entries(attrs)
  .map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(label)}</button>`;

function workers(list) {
  if (!list || !list.length) return '<div class="empty">no worker has connected yet (tab Connect)</div>';
  return `<table><tr><th>worker</th><th>provides</th><th>state</th><th>holds</th><th>CPU threads</th><th></th></tr>` +
    list.map((w) => {
      const info = w.info || {}, control = w.control || {};
      const cores = info.cores || 0;
      const threads = control.threads || info.threads;  // the choice shows before the worker reports it
      const state = control.paused ? tag("freed", "freed")
        : tag(w.online ? "active" : "unreachable", w.online ? "online" : "silent " + dur(w.age_s));
      const shares = [["¼", 0.25], ["½", 0.5], ["all", 1]].map(([label, f]) => {
        const n = Math.max(1, Math.round(cores * f));
        return cores ? act(label, {act: "threads", worker: w.name, value: n},
                           threads === n ? "on" : "") : "";
      }).join("");
      return `<tr><td class="mono">${esc(w.name)}<div class="sub">${esc(info.host || "")}
          ${cores ? "· " + cores + " threads, load " + info.load1 : ""}</div></td>
        <td>${esc((w.provides || []).join(", "))}${w.allow_command ? '<div class="sub">(commands)</div>' : ""}</td>
        <td>${state}${control.paused && w.job ? '<div class="sub">stopping its job …</div>' : ""}
          ${info.waiting ? `<div class="sub">waiting: ${esc(info.waiting)}</div>` : ""}</td>
        <td class="mono">${esc(w.job || "")}</td>
        <td>${threads ? threads : '<span class="sub">profile</span>'}<div>${shares}</div></td>
        <td>${control.paused ? act("Use again", {act: "use", worker: w.name})
                             : act("Free this computer", {act: "free", worker: w.name}, "danger")}</td></tr>`;
    }).join("") + "</table>";
}

function jobButtons(j) {
  if (!["queued", "claimed", "running"].includes(j.state)) return "";
  const stopped = j.held || j.hold_requested;
  return (stopped ? act("Continue", {act: "resume", job: j.id}) : act("Stop", {act: "hold", job: j.id})) +
    act("Kill", {act: "cancel", job: j.id, title: j.title}, "danger");
}

function jobs(list) {
  if (!list || !list.length) return '<div class="empty">no jobs; submit one (tab For agents)</div>';
  const order = {running: 0, claimed: 0, queued: 1};
  const rows = [...list].sort((a, b) => ((order[a.state] ?? 2) - (order[b.state] ?? 2)) ||
    (b.priority - a.priority) || (a.submitted_ts - b.submitted_ts));
  return `<table><tr><th>job</th><th>what</th><th>state</th><th class="num">prio</th><th>needs</th><th>by</th><th></th></tr>` +
    rows.map((j) => {
      const what = j.study ? j.study + (j.runs ? " · " + j.runs.join(", ") : "") : (j.argv || []).join(" ");
      const p = j.progress;
      const prog = p && p.step && p.steps
        ? `<div class="sub">${esc(p.run)} ${(100 * p.step / p.steps).toFixed(1)} %</div>` : "";
      return `<tr><td class="mono">${esc(j.id)}</td>
        <td><b>${esc(j.title)}</b><div class="sub mono">${esc(what.slice(0, 120))}</div>${prog}
          ${j.note ? `<div class="sub">${esc(j.note)}</div>` : ""}</td>
        <td>${tag(j.state === "queued" && j.held ? "stopped" : j.hold_requested ? "stopping"
              : j.cancel_requested ? "stopping" : j.state)}${j.claimed_by ? `<div class="sub">${esc(j.claimed_by)}</div>` : ""}
          ${j.requeued ? `<div class="sub">requeued ${j.requeued}×</div>` : ""}</td>
        <td class="num">${j.priority}</td><td>${esc(j.needs)}</td><td class="sub">${esc(j.submitted_by)}</td>
        <td>${jobButtons(j)}</td></tr>`;
    }).join("") + "</table>";
}

function queueTab(d) {
  return `<h2>Computers</h2>${workers(d.workers)}<h2>Jobs</h2>${jobs(d.jobs)}
    <p class="sub">Stop: the job writes a checkpoint and waits until Continue. Kill: the job ends for good.
    Free this computer: its job stops and goes back to the queue, and it gets no new one. A button takes up
    to 15 s to reach a computer.</p>`;
}

function md(src) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const out = []; let para = [], code = [], list = null, li = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushCode = () => { if (code.length) { out.push(`<pre class="code">${esc(code.join("\n"))}</pre>`); code = []; } };
  const flushList = () => { if (li !== null) { out.push(`<li>${inline(li)}</li>`); li = null; } if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of src.split("\n")) {
    if (/^ {4,}\S/.test(line)) { flushPara(); if (li !== null) { out.push(`<li>${inline(li)}</li>`); li = null; } code.push(line.replace(/^ {4}/, "")); continue; }
    if (code.length && line.trim() === "") { code.push(""); continue; }
    flushCode();
    let m;
    if ((m = /^(#{1,3}) (.*)/.exec(line))) { flushPara(); flushList(); out.push(`<h${m[1].length === 1 ? 1 : 2}>${inline(m[2])}</h${m[1].length === 1 ? 1 : 2}>`); }
    else if ((m = /^(\d+\.|-) (.*)/.exec(line))) {
      flushPara(); const kind = m[1] === "-" ? "ul" : "ol";
      if (list && list !== kind) flushList();
      if (!list) { list = kind; out.push(`<${kind}>`); } else if (li !== null) out.push(`<li>${inline(li)}</li>`);
      li = m[2];
    }
    else if (line.trim() === "") { flushPara(); if (li !== null) { out.push(`<li>${inline(li)}</li>`); li = null; } }
    else if (li !== null && /^ {2,3}\S/.test(line)) li += " " + line.trim();
    else { flushList(); para.push(line.trim()); }
  }
  flushPara(); flushCode(); flushList();
  return out.join("\n");
}

async function docTab(name) {
  try {
    const r = await fetch(`/docs/${name}.md`, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    return `<div class="doc">${md(await r.text())}</div>`;
  } catch (e) {
    return `<div class="err">cannot load ${esc(name)}: ${esc(e)}</div>`;
  }
}

function node(d, local) {
  if (d.reachable === false)
    return `<div class="node"><h1>${esc(d.node)} ${tag("unreachable")}</h1>
      <div class="err">${esc(d.error)}</div></div>`;
  const errs = (d.errors || []).length
    ? `<div class="card err">${d.errors.map(esc).join("<br>")}</div>` : "";
  return `<div class="${local ? "" : "node"}">
    ${local ? "" : `<h1>${esc(d.node)}</h1>`}
    <div class="sub">${local ? esc(d.node) + " · " : ""}state of ${esc(d.time)}</div>${errs}
    <h2>Resources</h2>${resources(d.resources)}
    <h2>Running now</h2>${running(d.running)}
    <h2>Next</h2>${next(d.next)}
    <h2>Tasks (docs/tasks.toml)</h2>${tasks(d.tasks)}
    <h2>Queue scripts</h2>${queues(d.queues)}
    <h2>Studies</h2>${studies(d.studies)}
    <h2>Log</h2><div class="card"><pre>${esc((d.events || []).join("\n"))}</pre></div></div>`;
}

const TABS = [["overview", "Overview"], ["queue", "Queue"], ["connect", "Connect a computer"],
              ["agents", "For agents"]];
let tab = (location.hash || "#overview").slice(1);
if (!TABS.some((t) => t[0] === tab)) tab = "overview";
const docCache = {};
function drawTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(
    ([id, label]) => `<button class="${id === tab ? "on" : ""}" data-tab="${id}">${esc(label)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab; location.hash = tab; drawTabs(); refresh();
  }));
}

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const d = await r.json();
    let html;
    if (d.starting) html = "starting …";
    else if (tab === "queue") html = queueTab(d);
    else if (tab === "connect" || tab === "agents") {
      if (!docCache[tab]) docCache[tab] = await docTab(tab);
      html = docCache[tab];
    } else html = node(d, true) + (d.remotes || []).map((x) => node(x, false)).join("");
    document.getElementById("nodes").innerHTML = html;
    document.getElementById("stamp").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("stamp").innerHTML = `<span class="err">no answer from the server: ${esc(e)}</span>`;
  }
}
// Buttons change things, so they need the server's token; it is asked for once and kept in this browser.
function token(forget) {
  const key = "ucmd-queue-token";
  try {
    if (forget) { localStorage.removeItem(key); return null; }
    let t = localStorage.getItem(key);
    if (!t) {
      t = (window.prompt("Queue token ([server] token on the server):") || "").trim();
      if (t) localStorage.setItem(key, t);
    }
    return t || null;
  } catch (e) {
    return (window.prompt("Queue token:") || "").trim() || null;
  }
}

async function post(path, body) {
  const t = token();
  if (!t) return;
  const r = await fetch(path, {method: "POST", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json", "Authorization": "Bearer " + t}});
  if (r.status === 401) { token(true); window.alert("The server refused the token; try again."); return; }
  if (!r.ok) window.alert((await r.json().catch(() => ({}))).error || "refused: " + r.status);
}

document.getElementById("nodes").addEventListener("click", async (event) => {
  const b = event.target.closest("button[data-act]");
  if (!b) return;
  const {act: what, job, worker, value, title} = b.dataset;
  if (what === "cancel" && !window.confirm(`Kill "${title}"? It will not continue.`)) return;
  try {
    if (job) await post(`/api/jobs/${job}/${what}`, {});
    else if (what === "threads") await post(`/api/workers/${worker}/control`, {threads: Number(value)});
    else await post(`/api/workers/${worker}/control`, {paused: what === "free"});
  } catch (e) {
    window.alert("no answer from the server: " + e);
  }
  refresh();
});

drawTabs();
refresh();
setInterval(() => { if (tab !== "connect" && tab !== "agents") refresh(); }, 5000);
</script>
</body>
</html>
