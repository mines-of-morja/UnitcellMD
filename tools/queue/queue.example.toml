# Machine-specific settings of the queue dashboard (docs/design/queue.md).
# Copy to ~/.config/ucmd/queue.toml. Every key is optional; without a file the dashboard shows the
# studies and the CPU load only.

[node]
name = "workstation"
# studies_dir = "~/ucmd/studies"       # default: the studies/ folder of this repository

[[gpu]]
name = "gpu0"
telemetry = "~/.cache/ucmd-overnight/gpu-telemetry.tsv"   # tab-separated, header: time_utc, edge_C, ...
container_image = "ucmd-openmm"        # a running container whose image contains this holds the GPU
# a process whose command line matches pauses the GPU (e.g. a game that needs it):
# pause_process_regex = "[g]ame-launcher"

[queue_scripts]                        # the hand-written queue scripts, until the scheduler exists
dir = "~/.cache/ucmd-overnight"
log = "~/.cache/ucmd-overnight/resume.log"

# another node that runs this dashboard (reach it through `ssh -L 8766:127.0.0.1:8765 host`):
# [[remote]]
# name = "side-computer"
# url = "http://127.0.0.1:8766"

# --- job queue ------------------------------------------------------------------------------
# The server: `ucmd_queue.py serve`. A token is needed for every POST and to listen beyond this machine.
[server]
token = "<python3 -c 'import secrets; print(secrets.token_urlsafe(32))'>"
# bind = "0.0.0.0"          # let other computers connect; default 127.0.0.1
# port = 8765
# spool = "~/ucmd-queue"    # default: queue/ in the repository (gitignored)

# A worker: `ucmd_queue.py work --worker NAME`. One job at a time; the tags it provides are the
# resource tags jobs ask for (--needs). The tags table says which machine profile and engine to use.
[[worker]]
name = "workstation-gpu"
provides = ["gpu-hip-mixed", "gpu-hip-double"]
allow_command = true                  # run `command` jobs (argv lists) - only on machines you trust
nice = 10
# threads = 6                          # CPU threads per job (the dashboard can change it)
container_image = "ucmd-openmm"       # take no job while a container of this image runs
wait_for_queue_scripts = true         # ... or while a hand-written gpu-queue*.sh is alive
# pause_process_regex = "[g]ame-launcher"   # stop gracefully and release the job while it runs
# server = "http://192.168.0.10:8765"        # a worker on another computer (needs the token)
# studies_dir = "..."                        # default: studies/ of the clone (mount the server's)

[worker.tags.gpu-hip-mixed]
profile = "~/.config/ucmd/machine-gpu-mixed.toml"
# ucmd = "~/path/to/ucmd"

# On a computer that only submits jobs (agents there use the same CLI):
# [client]
# server = "http://192.168.0.10:8765"
# token = "..."
