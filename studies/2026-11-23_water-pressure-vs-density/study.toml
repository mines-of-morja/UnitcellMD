# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-23"
question = "Density puzzle of rung W: P(rho) of SPC/Fw (512 molecules, 298.16 K, Wu 2006 settings) from three NVT runs on the GPU at 1.000, 1.0072 (the NPT density found) and 1.012 g/cm3 (Wu), to test whether the engine NPT density is consistent with its own NVT pressure"
requested_by = "the author, 2026-11-23 (what is next after the Wu result)"

[systems]
recipes = "recipes/*.toml"

[scan]
temperature_C = [25.01]

[protocol]
seed = 20261123

[estimate]
seconds_per_atom_per_run = 2.0

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

[minimize_template]
spec_version = "0.1.0"

[minimize_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 0
seed = 1

[[minimize_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

# NVT at 298.16 K, 2 ns at 1 fs, pressure every 0.1 ps. Same force field, cutoff, PME and tail
# correction as rung W. Nosé–Hoover chain with tau = 1 ps (gentle on the dynamics).
# GPU, HIP double precision, bridge of branch e25-constraints.
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 2000000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 1.0
chain_length = 3

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.trajectory]
file = "trajectory.h5"
every = 5000
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 100000
