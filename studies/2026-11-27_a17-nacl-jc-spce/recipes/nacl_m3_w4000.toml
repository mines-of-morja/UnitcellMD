# A1.7 target 2 (README.md): 4000 SPC/E water and 216 NaCl, 3 mol/kg, 8 times
# the composition of Mester & Panagiotopoulos 2015 (SI Table IV: 27 NaCl in 500 water).
# Built with ucmd-builder branch claude/a17-nacl-spce (set nacl-jc-spce), see make_packages.sh.
format = "ucmd-build"
version = "0.1"
name = "nacl_m3_w4000"
seed = 273

[forcefield]
source = "library"
set = "nacl-jc-spce"

[[component]]
name = "Na"
molecule = { library = "Na" }
count = 216

[[component]]
name = "Cl"
molecule = { library = "Cl" }
count = 216

[[component]]
name = "water"
molecule = { library = "water" }
count = 4000

[box]
# cube of the volume 125.8400 nm3: Mester & Panagiotopoulos 2015, SI Table IV: <V> = 15.73 nm3 for 27 NaCl in 500 water, scaled by 4000/500 (packing start only; NPT sets the volume)
length_nm = 5.0112

[packing]
method = "packmol"
tolerance_nm = 0.2

[velocities]
temperature_K = 298.15
