# A1.7 target 2 (README.md): 4000 SPC/E water and 144 NaCl, 2 mol/kg, 8 times
# the composition of Mester & Panagiotopoulos 2015 (SI Table IV: 18 NaCl in 500 water).
# Built with ucmd-builder branch claude/a17-nacl-spce (set nacl-jc-spce), see make_packages.sh.
format = "ucmd-build"
version = "0.1"
name = "nacl_m2_w4000"
seed = 272

[forcefield]
source = "library"
set = "nacl-jc-spce"

[[component]]
name = "Na"
molecule = { library = "Na" }
count = 144

[[component]]
name = "Cl"
molecule = { library = "Cl" }
count = 144

[[component]]
name = "water"
molecule = { library = "water" }
count = 4000

[box]
# cube of the volume 123.4400 nm3: Mester & Panagiotopoulos 2015, SI Table IV: <V> = 15.43 nm3 for 18 NaCl in 500 water, scaled by 4000/500 (packing start only; NPT sets the volume)
length_nm = 4.9791

[packing]
method = "packmol"
tolerance_nm = 0.2

[velocities]
temperature_K = 298.15
