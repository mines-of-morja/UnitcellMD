# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-27"
question = "After SC-4 and the 3 M map: how much of the salt's excess apparent volume (16 cm3/mol) does the PF6 size carry? PF6 sigma x0.95 and x1.05 on the SC-4 3 M box, 0.5 fs, 3 ns; a map, not a fit"
requested_by = "author 2026-11-27 noon: yes to a PF6-size map (probe values only) if the 3 M map and the literature point at the anion"

[systems]
packages = "packages/*.ucsys"

[scan]
temperature_C = [20]

[protocol]
seed = 20261136

[estimate]
seconds_per_atom_per_run = 1.2

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

# SC-1's 1 M protocol at 0.5 fs (every interval the same in time as at 1 fs), 3 ns. Plan: README.md
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 0.5
steps = 6000000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 200

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

[run_template.barostat]
kind = "c-rescale"
pressure_bar = 1.01325
tau_ps = 1.0
compressibility_per_bar = 4.5e-5
every = 50

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 1.4
coulomb = "pme"
ewald_tolerance = 1e-5
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 200

[run_template.output.trajectory]
file = "trajectory.h5"
every = 4000
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 200000
