# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file. Change it only before the first run: finished runs keep the run.toml they had.

[study]
created = "2026-11-17"
question = "Level 1 with the agreed protocol (LJ tail correction on): densities of pure EC, EMC, DMC, PC and MP at 1 atm and 25/40 °C against Lehnert 2025 SI Table S2"
requested_by = "the author, 2026-11-17 (research plan; tail correction on, ADR 0009 amendment)"

[systems]
recipes = "recipes/*.toml"
# Recipe stem "ec-emc_3-7w_1.0M" → mixture "ec-emc_3-7w", concentration_M "1.0".
label = '^(?P<solvent>[a-z]+)_pure$'

[scan]
temperature_C = [25, 40]
# EMC (70 % of Lehnert's benchmark solvent) and EC first.
priority = { solvent = ["emc", "ec", "dmc", "pc", "mp"] }

[protocol]
seed = 20261121  # each run's seed: this + crc32(run id) mod 10^6 (independent of the order)

[estimate]
seconds_per_atom_per_run = 0.25  # GPU (Radeon VII, OpenCL double): ~25 ns/day for 7000 atoms

[index]
group_by = "T"
row_by = "solvent"
grid = "density"

# Symbolic views: links into runs/, sorted another way. Keys: system, mixture,
# concentration_M, T.
[views]
by-temperature = "{T}/{system}"

# Minimization of each built box, once (FIRE until max |F| < 100 kJ/mol/nm).
[minimize_template]
spec_version = "0.1.0"

[minimize_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 0
seed = 1

[[minimize_template.providers]]
kind = "force-field"
cutoff_nm = 1.4
coulomb = "pme"
ewald_tolerance = 1e-5
dispersion_correction = true

# Each run: 500 ps NPT at 1 atm from the minimized box, on the GPU backend (E3.7; run the driver
# with UCMD_MACHINE_PROFILE=~/.config/ucmd/machine-gpu.toml). Settings of Lehnert 2025, SI S1.1:
# 1 fs, no constraints, Nosé–Hoover τ = 0.1 ps, 1.4 nm cutoff, PME to 1e-5, no LJ tail
# correction OFF in the earlier study; ON here (ADR 0009 amendment). On the GPU backend the barostat is OpenMM's MonteCarloBarostat (same ensemble as
# C-rescale; validated for argon).
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 500000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

# 1 atm = 1.01325 bar (definition). The compressibility only sets how fast the volume relaxes
# (with tau_p); the sampled density does not depend on it (Bernetti & Bussi 2020). 4.5e-5/bar is
# GROMACS's customary value for water, used here as a coupling setting.
[run_template.barostat]
kind = "c-rescale"
pressure_bar = 1.01325
tau_ps = 1.0
compressibility_per_bar = 4.5e-5
every = 25

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 1.4
coulomb = "pme"
ewald_tolerance = 1e-5
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.trajectory]
file = "trajectory.h5"
every = 10000
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 50000
