# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-20"
question = "Rung W of the validation ladder (design E2.9): density of SPC/Fw water at 298.15 K and 1 atm with the CPU reference engine, for comparison with the OpenMM backend and with Wu, Tepper, Voth 2006"
requested_by = "the author, 2026-11-20 (resolve the problems one by one, run short dynamics and validations)"

[systems]
recipes = "recipes/*.toml"

[scan]
temperature_C = [25]

[protocol]
seed = 20261120

[estimate]
seconds_per_atom_per_run = 7.5

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

[minimize_template]
spec_version = "0.1.0"

[minimize_template.run]
integrator = "velocity-verlet"
timestep_fs = 0.5
steps = 0
seed = 1

[[minimize_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-5
dispersion_correction = true

# NPT at 1 atm on the CPU reference backend. Flexible water: 0.5 fs, no constraints.
# Cutoff 0.9 nm (the 500-molecule box is 2.47 nm); PME 1e-5; LJ tail correction on.
# Whether these match Wu 2006's settings is checked when the paper is in ../Lit (design E2.9).
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 0.5
steps = 500000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

[run_template.barostat]
kind = "c-rescale"
pressure_bar = 1.01325
tau_ps = 1.0
compressibility_per_bar = 4.5e-5
every = 25

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-5
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.trajectory]
file = "trajectory.h5"
every = 2000
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 100000
