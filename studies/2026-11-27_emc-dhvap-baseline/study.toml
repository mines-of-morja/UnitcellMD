# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file. Plan and analysis: README.md.

[study]
created = "2026-11-27"
question = "SC-7 step 0: the enthalpy of vaporization of the current EMC model (LigParGen) at 25 C, gas phase of one molecule against SC-1's three EMC liquids at 1 fs; a measurement, no new parameter"
requested_by = "author 2026-11-27: SC-7 go ahead; this is the baseline the refit starts from (method of studies/2026-11-20_ec-opls-test)"

[systems]
packages = "packages/*.ucsys"

[scan]
temperature_C = [25]

[protocol]
seed = 20261137

[estimate]
seconds_per_atom_per_run = 60.0

[index]
group_by = "T"
row_by = "system"
grid = "energy"

[views]
by-temperature = "{T}/{system}"

# Gas phase as in the EC test: Langevin BAOAB, 1 fs (ADR 0017), friction 5/ps, 10 ns, no cutoff, direct Coulomb.
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "langevin-baoab"
timestep_fs = 1.0
steps = 10000000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.thermostat]
kind = "langevin"
friction_per_ps = 5.0

[[run_template.providers]]
kind = "force-field"
coulomb = "direct"

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 1000000
