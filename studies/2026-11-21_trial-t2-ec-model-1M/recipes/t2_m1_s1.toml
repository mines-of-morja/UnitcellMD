# Trial T2 (docs/research/trials/T2-ec-model-1M.md), M1: the T2 M0 box with EC from Caleman 2012.
# Strategy step S2, model M1: as M0, but EC with the OPLS-AA atom types of Caleman et al. 2012
# (a test set, approved by the author 2026-11-20; not the working horse). Li+, PF6- and EMC as
# in M0. Both sources use OPLS conventions: geometric mixing, 1-4 scales 0.5/0.5.
# The EC parameters come from the rung-EC study's local, explicit copy
# (studies/2026-11-20_ec-opls-test/external/, written by make_explicit_itp.py; not in git).
format = "ucmd-build"
version = "0.1"
name = "t2_m1_s1"
description = "Trial T2, M1 seed 1: 1 M LiPF6 (47 pairs, zeta 0.75) in 168 EC (OPLS-AA, Caleman 2012) + 332 EMC (LigParGen), Lehnert 2025 box; packing seed 20261124"
seed = 20261124

[forcefield]
source = "library"
set = "opls-aa-carbonates"

[[component]]
name = "Li"
molecule = { library = "Li" }
count = 47
charge_scale = 0.75

[[component]]
name = "PF6"
molecule = { library = "PF6" }
count = 47
charge_scale = 0.75

[[component]]
name = "EC"
molecule = { smiles = "O=C1OCCO1" }
count = 168

[component.forcefield]
source = "gromacs-top"
# relative to systems/<system>/, where the study driver builds its copy of this recipe
file = "../../../2026-11-20_ec-opls-test/external/ec-oplsaa-explicit.itp"
citations = [
    { what = "EC: OPLS-AA atom types opls_771-777 with bonded types of oplsaaff.itp, topology 96-49-1.top", citation = "C. Caleman, P. J. van Maaren, M. Hong, J. S. Hub, L. T. Costa, D. van der Spoel, J. Chem. Theory Comput. 8, 61 (2012); files from virtualchemistry.org" },
    { what = "OPLS-AA force field", citation = "W. L. Jorgensen, D. S. Maxwell, J. Tirado-Rives, J. Am. Chem. Soc. 118, 11225 (1996)" },
]

[[component]]
name = "EMC"
molecule = { library = "EMC" }
count = 332

[box]
length_nm = 4.27

[packing]
method = "packmol"
tolerance_nm = 0.2
