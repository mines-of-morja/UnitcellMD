# Pure MP, 500 molecules, in a box at its manufacturer density (Lehnert 2025 SI Table S2).
# The NPT run then finds the force field's own density at 1 atm.
format = "ucmd-build"
version = "0.1"
name = "mp_pure"
description = "pure MP, 500 molecules; start at the Lehnert 2025 SI Table S2 density"
seed = 20261117
component = [
    { name = "MP", molecule = { library = "MP" }, count = 500 },
]

[forcefield]
source = "library"
set = "opls-aa-carbonates"

[box]
length_nm = 4.3079

[packing]
method = "packmol"
tolerance_nm = 0.2
