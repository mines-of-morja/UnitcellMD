# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-25"
question = "SC-3 test 2, arm B: NPT density of SPC/Fw water (512 molecules, 298.16 K, 1 atm, 1 fs), CPU engine with the molecular barostat pressure (SC-3 option B); three seeds"
requested_by = "the author, 2026-11-25 (density test right after the reboot)"

[systems]
recipes = "recipes/*.toml"

[scan]
temperature_C = [25.01]

[protocol]
seed = 20261126

[estimate]
seconds_per_atom_per_run = 21.0

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

[minimize_template]
spec_version = "0.1.0"

[minimize_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 0
seed = 1

[[minimize_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

# The settings of 2026-11-20_water-spcfw-wu (Wu 2006 §II B), 1 ns. Plan, criterion and analysis:
# ../2026-11-25_water-npt-cpu-molecular/README.md
[run_template]
spec_version = "0.1.3"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 1000000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

[run_template.barostat]
kind = "c-rescale"
pressure_bar = 1.01325
tau_ps = 1.0
compressibility_per_bar = 4.5e-5
every = 25

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100
pressure_molecular = true

[run_template.output.trajectory]
file = "trajectory.h5"
every = 500
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 100000
