# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-25"
question = "Queue test of the second computer (worker cpu-soricel): one short CPU run, 5 ps NVT of 512 SPC/Fw water; not a result. The same run.toml on the workstation should give the same numbers (ADR 0010)"
requested_by = "the author, 2026-11-25 (connect the second computer to the queue; one short CPU test study)"

[systems]
packages = "../2026-11-25_water-npt-gpu/systems/spcfw_512_s1/minimized.ucsys"

[scan]
temperature_C = [25.01]

[protocol]
seed = 20261132

[estimate]
seconds_per_atom_per_run = 0.2

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

# The settings of 2026-11-20_water-spcfw-wu without the barostat (NVT), 5 ps.
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 5000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.trajectory]
file = "trajectory.h5"
every = 1000
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 2500
