# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-24"
question = "Which parameters move the ions at 1 M, 20 C? One-at-a-time sensitivity scan around M1 (zeta, sigma of Li+, LJ epsilon of EMC), 5 ns NPT on the GPU; a map of trends, no parameter is chosen from it"
requested_by = "author 2026-11-24 (multiple parameters, about 5 ns, plot the trends; design approved the same day)"

[systems]
packages = "packages/*.ucsys"

[scan]
temperature_C = [20]

# extremes first, so that the trends show early
[scan.priority]
system = ["base_s1", "zeta_0.85", "sigmaLi_x0.90", "epsEMC_x0.85", "zeta_0.65", "sigmaLi_x1.10", "epsEMC_x1.05", "base_s2", "zeta_0.80", "sigmaLi_x0.95", "epsEMC_x0.90", "zeta_0.70", "sigmaLi_x1.05", "epsEMC_x0.95", "base_s3"]

[protocol]
seed = 20261125

[estimate]
seconds_per_atom_per_run = 1.0

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

# The T2 protocol unchanged (Lehnert 2025 settings): NPT 1 atm, 1 fs, no constraints, Nosé–Hoover
# tau 0.1 ps, barostat tau_p 1 ps, 1.4 nm, PME 1e-5, LJ tail. 5 ns; the last 3.5 ns are analysed.
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 5000000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

[run_template.barostat]
kind = "c-rescale"
pressure_bar = 1.01325
tau_ps = 1.0
compressibility_per_bar = 4.5e-5
every = 25

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 1.4
coulomb = "pme"
ewald_tolerance = 1e-5
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.trajectory]
file = "trajectory.h5"
every = 2000
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 100000
