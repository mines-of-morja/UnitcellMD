# SC-4 (docs/tasks.toml): model M1 of trial T2 at 2.0 M. Counts and initial box edge from the author's table
# ucmd-builder/examples/EC/boxes.csv (Lehnert 2025 SI Table S1): 7484 atoms. Force field exactly as T2 M1:
# EC from Caleman 2012 (OPLS-AA, local explicit copy, see T2), EMC LigParGen, Li+ JJ06, PF6- CL&P, zeta 0.75.
format = "ucmd-build"
version = "0.1"
name = "m1_2.0M"
description = "SC-4, M1: 2.0 M LiPF6 (103 pairs, zeta 0.75) in 168 EC (OPLS-AA, Caleman 2012) + 332 EMC (LigParGen); counts of Lehnert 2025 SI Table S1"
seed = 20261127

[forcefield]
source = "library"
set = "opls-aa-carbonates"

[[component]]
name = "Li"
molecule = { library = "Li" }
count = 103
charge_scale = 0.75

[[component]]
name = "PF6"
molecule = { library = "PF6" }
count = 103
charge_scale = 0.75

[[component]]
name = "EC"
molecule = { smiles = "O=C1OCCO1" }
count = 168

[component.forcefield]
source = "gromacs-top"
# relative to systems/<system>/, where the study driver builds its copy of this recipe
file = "../../../2026-11-20_ec-opls-test/external/ec-oplsaa-explicit.itp"
citations = [
    { what = "EC: OPLS-AA atom types opls_771-777 with bonded types of oplsaaff.itp, topology 96-49-1.top", citation = "C. Caleman, P. J. van Maaren, M. Hong, J. S. Hub, L. T. Costa, D. van der Spoel, J. Chem. Theory Comput. 8, 61 (2012); files from virtualchemistry.org" },
    { what = "OPLS-AA force field", citation = "W. L. Jorgensen, D. S. Maxwell, J. Tirado-Rives, J. Am. Chem. Soc. 118, 11225 (1996)" },
]

[[component]]
name = "EMC"
molecule = { library = "EMC" }
count = 332

[box]
length_nm = 4.41

[packing]
method = "packmol"
tolerance_nm = 0.2
