# V-4 (docs/tasks.toml): the salt-free solvent of model M1, EC:EMC 3:7 w:w. The solvent counts of the 1 M box
# (Lehnert 2025 SI Table S1, ucmd-builder/examples/EC/boxes.csv: 168 EC + 332 EMC) without the 47 LiPF6 pairs:
# 6660 atoms. Force field exactly as T2 M1 and SC-4: EC from Caleman 2012 (OPLS-AA, local explicit copy, see T2),
# EMC LigParGen. Packing seed 20261181 (replica 1 of 3; independent starts, publication.md rule 2).
format = "ucmd-build"
version = "0.1"
name = "m1_solvent_s1"
description = "V-4, M1 solvent replica 1: 168 EC (OPLS-AA, Caleman 2012) + 332 EMC (LigParGen), EC:EMC 3:7 w:w, no salt; packing seed 20261181"
seed = 20261181

[forcefield]
source = "library"
set = "opls-aa-carbonates"

[[component]]
name = "EC"
molecule = { smiles = "O=C1OCCO1" }
count = 168

[component.forcefield]
source = "gromacs-top"
# relative to systems/<system>/, where the study driver builds its copy of this recipe
file = "../../../2026-11-20_ec-opls-test/external/ec-oplsaa-explicit.itp"
citations = [
    { what = "EC: OPLS-AA atom types opls_771-777 with bonded types of oplsaaff.itp, topology 96-49-1.top", citation = "C. Caleman, P. J. van Maaren, M. Hong, J. S. Hub, L. T. Costa, D. van der Spoel, J. Chem. Theory Comput. 8, 61 (2012); files from virtualchemistry.org" },
    { what = "OPLS-AA force field", citation = "W. L. Jorgensen, D. S. Maxwell, J. Tirado-Rives, J. Am. Chem. Soc. 118, 11225 (1996)" },
]

[[component]]
name = "EMC"
molecule = { library = "EMC" }
count = 332

[box]
length_nm = 4.30

[packing]
method = "packmol"
tolerance_nm = 0.2
