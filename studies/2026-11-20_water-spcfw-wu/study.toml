# The plan of this study (ADR 0011). Read by tools/study/ucmd_study.py; paths are relative to
# this file.

[study]
created = "2026-11-20"
question = "Rung W (design E2.9, P3/P4/P1): SPC/Fw water as in Wu, Tepper, Voth 2006 (216 molecules, 298.16 K, 1 atm, 1 fs, 9 Å cutoff + tail corrections, PME 1e-6, 6.5 ns, first 0.5 ns skipped) on the GPU with the identity-fixed bridge: ρ, ΔH_vap, D, ε, ⟨r_OH⟩, ⟨θ⟩, ⟨μ⟩ against Table II"
requested_by = "the author, 2026-11-20 (Wu 2006 added to ../Lit; order of design E2.9 approved)"

[systems]
recipes = "recipes/*.toml"

[scan]
temperature_C = [25.01]

[protocol]
seed = 20261125

[estimate]
seconds_per_atom_per_run = 2.0

[index]
group_by = "T"
row_by = "system"
grid = "density"

[views]
by-temperature = "{T}/{system}"

[minimize_template]
spec_version = "0.1.0"

[minimize_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 0
seed = 1

[[minimize_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

# Wu 2006 §II B: NPT at 298.16 K and 1 atm (Nosé–Hoover thermostat and barostat), LJ cutoff
# 9 Å plus long-range corrections for energy and pressure, PME precision 1e-6, leapfrog at
# 1 fs for the flexible models, 6.5 ns, configurations every 0.5 ps, first 0.5 ns equilibration.
# Differences: velocity Verlet with a Nosé–Hoover chain, C-rescale instead of a Nosé–Hoover
# barostat (same ensemble).
[run_template]
spec_version = "0.1.0"

[run_template.run]
integrator = "velocity-verlet"
timestep_fs = 1.0
steps = 6500000

[run_template.velocities]
generate = "maxwell-boltzmann"

[run_template.momentum]
remove_com_every = 100

[run_template.thermostat]
kind = "nose-hoover-chain"
tau_ps = 0.1
chain_length = 3

[run_template.barostat]
kind = "c-rescale"
pressure_bar = 1.01325
tau_ps = 1.0
compressibility_per_bar = 4.5e-5
every = 25

[[run_template.providers]]
kind = "force-field"
cutoff_nm = 0.9
coulomb = "pme"
ewald_tolerance = 1e-6
dispersion_correction = true

[run_template.output]
directory = "out"

[run_template.output.thermo]
file = "thermo.tsv"
every = 100

[run_template.output.trajectory]
file = "trajectory.h5"
every = 500
precision = "float32"

[run_template.output.checkpoint]
file = "checkpoint.ucchk"
every = 100000
