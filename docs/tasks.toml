acceptance = "Criterion (confirmed by the author 2026-11-25, before any run; copied into the study README before the first run): within 1.5 % at every point, and the fitted d(rho)/dc reported against 0.0912 g/cm3 per M. The fit is stated for 0-50 C and 0.1-3 M; its markers sit at 10-50 C and 0-3 M, so 10 C replaces 0 C (SC-8). The reference itself is good to about 0.6 %. Reads density, not transport."

result = "studies/2026-11-27_density-concentration-M1 (README, Result): NO-GO. 0.1 M +2.81 %, 3 M -2.01 %, 1 M at 50 C +1.61 % fail; 1 M at 10/20 C and 2 M pass. d(rho)/dc 0.0710 +- 0.0009 against 0.0912 (22 % low), d(rho)/dT -0.001081 against -0.00109 (right). Solvent offset (+2.8 % near c = 0) and too-small ion slope cancel near 1 M. 0.5 fs, 3 ns. Follow-up map: studies/2026-11-27_density-slope-3M."

