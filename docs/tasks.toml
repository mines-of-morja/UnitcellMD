[[task]]
id = "SC-3"
title = "CPU pressure: on-step atomic estimator is biased at 1 fs for flexible molecules"
state = "claimed"
claimed_by = "unitcellmd-86"
priority = 2
needs = "cpu"
author = true
waits_for = "option B approved by the author 2026-11-25. No new runs before the reboot of 2026-11-25; long runs need a CPU free of Psi4"
goal = "Atomic minus molecular pressure was -129 +/- 9 bar in a 10 ps water run (predicted -127 from dt^2 F^2/4m). That closes the open 26 vs 123 bar question of studies/2026-11-23_water-pressure-vs-density. The CPU barostat (scaling_virial/scaling_kinetic_tensor in ucmd-md/src/dynamics.rs) uses atomic pressure for molecules without constraints."
deliverable = "(a) Validation report: bias at 1, 0.5 and 0.25 fs (expected ratio 4) for water and the electrolyte. (b) Design note with the options (half-step kinetic tensor, or molecular virial), with the effect on Green-Kubo viscosity. (c) After (a): a dated note under 'Open, not resolved' of the water study README."
acceptance = "Bias measured directly at three timesteps. The effect on the CPU DENSITY is unproven: the 0.5 fs water twins go the other way (CPU 1.0064(13), GPU 1.0103(12) g/cm3, 2.2 sigma); do not report a density bias before it is measured. No tolerance loosened; no engine change without approval."

result = "Design note docs/design/SC-3-pressure-estimator.md: option B approved 2026-11-25; not coded, no runs yet."

[[task]]
id = "SC-4"
title = "Density over concentration and temperature (go/no-go)"
state = "open"
priority = 1
needs = "gpu"
author = true
after = ["SC-1"]
waits_for = "SC-1 (timestep). Grid accepted by the author 2026-11-25; 1.5 % provisional ('we will see')"
goal = "M1, EC:EMC 3:7 w:w, NPT: 0.1, 2 and 3 M at 20 C, and 1 M at 0 and 50 C, against the Landesfeind 2019 fit at the box's own concentration. Expected from ideal mixing (extrapolation): about +2.2 % at 0.1 M falling to -0.8 % at 3 M; a slope means the ion model, an offset the solvent."
deliverable = "Study with README and criterion before the runs; recipes from ucmd-builder/examples/EC (ec-emc_3-7w_*M) with EC from Caleman 2012 as in T2 M1. Choose the run length from the settling time (trials rule 6); 3 M and 0 C relax slowly."
acceptance = "Criterion (provisional, to be written into the study README before the first run): within 1.5 % at every point, and the fitted d(rho)/dc reported against 0.0912 g/cm3 per M. The fit is stated for 0-50 C and 0.1-3 M; its markers sit at 10-50 C and 0-3 M, so the 0 C point tests an extrapolation (SC-8). The reference itself is good to about 0.6 %. Reads density, not transport."

