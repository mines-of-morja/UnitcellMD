title = "Density over concentration and temperature (go/no-go)"
state = "done"
claimed_by = "unitcellmd-c8"
priority = 1
needs = "gpu"
author = true
after = ["SC-1"]
waits_for = "SC-1 (timestep). Grid and 1.5 % limit confirmed by the author 2026-11-25; no run before the reboot"
goal = "M1, EC:EMC 3:7 w:w, NPT: 0.1, 2 and 3 M at 20 C, and 1 M at 10 (was 0) and 50 C, against the Landesfeind 2019 fit at the box's own concentration. Expected from ideal mixing (extrapolation): about +2.2 % at 0.1 M falling to -0.8 % at 3 M; a slope means the ion model, an offset the solvent."
